<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#ffd6e7"/>
  <title>Mis Notas 🌸</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="bg-flowers" aria-hidden="true">
    <svg class="flower f1" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g transform="translate(50,50)"><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.7" transform="rotate(0)"/><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.7" transform="rotate(60)"/><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.7" transform="rotate(120)"/><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.7" transform="rotate(180)"/><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.7" transform="rotate(240)"/><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.7" transform="rotate(300)"/><circle cx="0" cy="0" r="10" fill="#ffd6e4"/></g></svg>
    <svg class="flower f2" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g transform="translate(50,50)"><ellipse cx="0" cy="-20" rx="10" ry="20" fill="#f7a8bf" opacity="0.5" transform="rotate(0)"/><ellipse cx="0" cy="-20" rx="10" ry="20" fill="#f7a8bf" opacity="0.5" transform="rotate(72)"/><ellipse cx="0" cy="-20" rx="10" ry="20" fill="#f7a8bf" opacity="0.5" transform="rotate(144)"/><ellipse cx="0" cy="-20" rx="10" ry="20" fill="#f7a8bf" opacity="0.5" transform="rotate(216)"/><ellipse cx="0" cy="-20" rx="10" ry="20" fill="#f7a8bf" opacity="0.5" transform="rotate(288)"/><circle cx="0" cy="0" r="11" fill="#fce4ec"/></g></svg>
    <svg class="flower f3" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g transform="translate(50,50)"><ellipse cx="0" cy="-16" rx="8" ry="16" fill="#f48fb1" opacity="0.4" transform="rotate(0)"/><ellipse cx="0" cy="-16" rx="8" ry="16" fill="#f48fb1" opacity="0.4" transform="rotate(45)"/><ellipse cx="0" cy="-16" rx="8" ry="16" fill="#f48fb1" opacity="0.4" transform="rotate(90)"/><ellipse cx="0" cy="-16" rx="8" ry="16" fill="#f48fb1" opacity="0.4" transform="rotate(135)"/><ellipse cx="0" cy="-16" rx="8" ry="16" fill="#f48fb1" opacity="0.4" transform="rotate(180)"/><ellipse cx="0" cy="-16" rx="8" ry="16" fill="#f48fb1" opacity="0.4" transform="rotate(225)"/><ellipse cx="0" cy="-16" rx="8" ry="16" fill="#f48fb1" opacity="0.4" transform="rotate(270)"/><ellipse cx="0" cy="-16" rx="8" ry="16" fill="#f48fb1" opacity="0.4" transform="rotate(315)"/><circle cx="0" cy="0" r="9" fill="#ffd6e4"/></g></svg>
    <svg class="flower f4" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g transform="translate(50,50)"><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.6" transform="rotate(0)"/><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.6" transform="rotate(60)"/><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.6" transform="rotate(120)"/><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.6" transform="rotate(180)"/><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.6" transform="rotate(240)"/><ellipse cx="0" cy="-18" rx="9" ry="18" fill="#f9b8c9" opacity="0.6" transform="rotate(300)"/><circle cx="0" cy="0" r="10" fill="#fff0f5"/></g></svg>
    <svg class="flower f5" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g transform="translate(50,50)"><ellipse cx="0" cy="-22" rx="11" ry="22" fill="#e91e8c" opacity="0.15" transform="rotate(0)"/><ellipse cx="0" cy="-22" rx="11" ry="22" fill="#e91e8c" opacity="0.15" transform="rotate(72)"/><ellipse cx="0" cy="-22" rx="11" ry="22" fill="#e91e8c" opacity="0.15" transform="rotate(144)"/><ellipse cx="0" cy="-22" rx="11" ry="22" fill="#e91e8c" opacity="0.15" transform="rotate(216)"/><ellipse cx="0" cy="-22" rx="11" ry="22" fill="#e91e8c" opacity="0.15" transform="rotate(288)"/><circle cx="0" cy="0" r="12" fill="#fce4ec"/></g></svg>
  </div>

  <div class="container">

    <header class="header">
      <div class="header-deco left">
        <span class="petal">🌸</span><span class="petal">🌺</span><span class="petal">🌸</span>
      </div>
      <div class="header-text">
        <h1 class="title">Anotador para CAMI❤️</h1>
        <p class="subtitle">✨ Te amo mi amor ✨</p>
      </div>
      <div class="header-deco right">
        <span class="petal">🌸</span><span class="petal">🌺</span><span class="petal">🌸</span>
      </div>
    </header>

    <section class="editor-section">
      <div class="editor-card">
        <div class="editor-topbar">
          <span class="dot dot-pink"></span>
          <span class="dot dot-rose"></span>
          <span class="dot dot-blush"></span>
          <span class="editor-label">Nueva nota 🌷</span>
        </div>
        <input type="text" id="noteTitle" class="note-title-input"
          placeholder="Título de tu nota..." maxlength="60" autocomplete="off"/>
        <textarea id="noteContent" class="note-textarea"
          placeholder="Escribe aquí tus pensamientos, sueños, ideas... 🌸"
          maxlength="1000"></textarea>
        <div class="editor-footer">
          <span id="charCount" class="char-count">0 / 1000</span>
          <button id="saveBtnDesktop" class="save-btn save-btn--desktop">
            <span class="btn-icon">🌸</span>
            Guardar nota
          </button>
        </div>
      </div>
    </section>

    <div class="divider">
      <span class="div-line"></span>
      <span class="div-flower">❀ Mis Notas ❀</span>
      <span class="div-line"></span>
    </div>

    <section class="notes-section">
      <div id="emptyState" class="empty-state">
        <div class="empty-flower">🌷</div>
        <p>Aún no tienes notas.</p>
        <p class="empty-sub">¡Escribe tu primer pensamiento arriba!</p>
      </div>
      <div id="notesGrid" class="notes-grid"></div>
    </section>

  </div>

  <!-- Botón fijo en móvil -->
  <button id="saveBtnMobile" class="save-btn save-btn--mobile" aria-label="Guardar nota">
    <span class="btn-icon">🌸</span>
    Guardar nota
  </button>

  <div id="deleteModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-flower">🌺</div>
      <h2 id="modalTitle" class="modal-title">¿Eliminar nota?</h2>
      <p class="modal-text">Esta nota desaparecerá para siempre 🥺</p>
      <div class="modal-actions">
        <button id="cancelDelete" class="modal-btn cancel">Cancelar</button>
        <button id="confirmDelete" class="modal-btn confirm">Eliminar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
